name: Build iStoreOS for JDCloud RE-SS-01

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Build firmware
        run: |
          chmod +x ./build-istoreos-re-ss-01.sh
          WORK_DIR="$GITHUB_WORKSPACE/work" JOBS="$(nproc)" ./build-istoreos-re-ss-01.sh

      - name: Collect firmware
        if: always()
        run: |
          mkdir -p artifact
          # 收集固件文件
          cp work/istoreos/bin/targets/qualcommax/ipq60xx/*jdcloud_re-ss-01* artifact/ 2>/dev/null || true
          cp work/istoreos/bin/targets/qualcommax/ipq60xx/sha256sums artifact/ 2>/dev/null || true
          # 收集编译日志（用于排查问题）
          if [ -f work/istoreos/logs/ ]; then
            tar czf artifact/build-logs.tar.gz -C work/istoreos logs/ 2>/dev/null || true
          fi
          ls -lh artifact/ || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-jdcloud-re-ss-01
          path: artifact/
          retention-days: 30
